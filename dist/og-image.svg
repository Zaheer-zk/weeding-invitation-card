<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0907"/>
      <stop offset="0.5" stop-color="#0d0a0f"/>
      <stop offset="1" stop-color="#050407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#d4af6a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0d597"/>
      <stop offset="0.5" stop-color="#d4af6a"/>
      <stop offset="1" stop-color="#8a6321"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#caa253" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#caa253" stop-opacity="1"/>
      <stop offset="1" stop-color="#caa253" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative outer frame -->
  <rect x="36" y="36" width="1128" height="558" rx="8" ry="8"
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
  <rect x="50" y="50" width="1100" height="530" rx="6" ry="6"
        fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>

  <!-- Crescent + star mark -->
  <g transform="translate(600,118)">
    <path d="M22 0a22 22 0 1 1-16.5-21.4A17 17 0 1 0 22 0z"
          fill="url(#gold)"/>
    <circle cx="28" cy="-14" r="2.6" fill="url(#gold)"/>
  </g>

  <!-- Bismillah -->
  <text x="600" y="190" text-anchor="middle"
        fill="#e8c87a" font-family="Amiri, serif" font-size="34" font-weight="700"
        direction="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <!-- Divider -->
  <line x1="380" y1="222" x2="820" y2="222" stroke="url(#line)" stroke-width="1"/>
  <circle cx="600" cy="222" r="3" fill="#d4af6a"/>

  <!-- Title -->
  <text x="600" y="285" text-anchor="middle"
        fill="#f5ecd9" font-family="Cinzel, serif" font-size="32"
        letter-spacing="14" font-weight="500">WEDDING INVITATION</text>

  <!-- Couple -->
  <text x="600" y="370" text-anchor="middle"
        fill="url(#gold)" font-family="Cinzel, serif" font-size="64"
        letter-spacing="8" font-weight="600">ZAHEER</text>
  <text x="600" y="418" text-anchor="middle"
        fill="#caa253" font-family="Cormorant Garamond, serif"
        font-size="42" font-style="italic">&amp;</text>
  <text x="600" y="478" text-anchor="middle"
        fill="url(#gold)" font-family="Cinzel, serif" font-size="64"
        letter-spacing="8" font-weight="600">ALFIYA</text>

  <!-- Dates -->
  <line x1="380" y1="510" x2="820" y2="510" stroke="url(#line)" stroke-width="1"/>
  <text x="600" y="552" text-anchor="middle"
        fill="#efe3c9" font-family="Cormorant Garamond, serif"
        font-size="22" letter-spacing="3" font-style="italic">
    Nikkah · Friday 24 July 2026  ·  Walima · Sunday 26 July 2026
  </text>

  <!-- Foot -->
  <text x="600" y="590" text-anchor="middle"
        fill="#caa253" font-family="Cinzel, serif" font-size="14"
        letter-spacing="8">YOU ARE CORDIALLY INVITED</text>

  <!-- Corner ornaments -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.2" stroke-linecap="round">
    <g transform="translate(70,70)">
      <path d="M0 50 Q0 0 50 0"/>
      <path d="M10 40 Q10 10 40 10" opacity="0.6"/>
      <circle cx="4" cy="4" r="2" fill="url(#gold)" stroke="none"/>
    </g>
    <g transform="translate(1130,70) scale(-1,1)">
      <path d="M0 50 Q0 0 50 0"/>
      <path d="M10 40 Q10 10 40 10" opacity="0.6"/>
      <circle cx="4" cy="4" r="2" fill="url(#gold)" stroke="none"/>
    </g>
    <g transform="translate(70,560) scale(1,-1)">
      <path d="M0 50 Q0 0 50 0"/>
      <path d="M10 40 Q10 10 40 10" opacity="0.6"/>
      <circle cx="4" cy="4" r="2" fill="url(#gold)" stroke="none"/>
    </g>
    <g transform="translate(1130,560) scale(-1,-1)">
      <path d="M0 50 Q0 0 50 0"/>
      <path d="M10 40 Q10 10 40 10" opacity="0.6"/>
      <circle cx="4" cy="4" r="2" fill="url(#gold)" stroke="none"/>
    </g>
  </g>
</svg>
